name: Release Windows package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build editor
        shell: powershell
        run: .\studio\build.ps1
      - name: Package Windows release
        shell: powershell
        run: |
          $name = "fan-studio-${{ github.ref_name }}-windows"
          $out = Join-Path $PWD "dist\$name"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item .\studio\fan_studio.exe $out
          Copy-Item .\studio\fan_core_test.exe $out
          Copy-Item .\studio\motors.txt $out
          Copy-Item .\studio\selftest.fscore $out
          Copy-Item .\README.md, .\LICENSE, .\THIRD_PARTY_NOTICES.md $out
          Copy-Item .\studio\使用说明.md, .\studio\用户协议.md, .\studio\隐私政策.md $out
          Copy-Item .\scores $out -Recurse
          Copy-Item .\fan_music $out -Recurse
          Copy-Item .\arduino $out -Recurse
          Copy-Item .\tools $out -Recurse
          Compress-Archive -Path $out -DestinationPath "dist\$name.zip" -CompressionLevel Optimal
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
